<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — MarketPanelServer</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/img/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="stylesheet" href="/css/style.css">
<style>
.order-card {
  background: linear-gradient(180deg, var(--bg-card-soft), var(--bg-card));
  border: 1px solid var(--border-strong);
  border-radius: 16px;
  padding: 20px 22px;
  margin-bottom: 16px;
  box-shadow: var(--shadow-block);
  transition: transform .18s ease, border-color .18s ease;
}
.order-card:hover { transform: translateY(-2px); border-color: var(--accent); }
.order-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 14px;
}
.order-title { font-weight: 700; font-size: 15px; }
.order-sub { color: var(--text-dim); font-size: 12px; margin-top: 2px; }
.spec-pills { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.spec-pill {
  background: rgba(var(--glow-rgb),.06);
  border: 1px solid rgba(var(--glow-rgb),.18);
  color: var(--text);
  font-size: 12px;
  padding: 5px 12px;
  border-radius: 999px;
}
.cred-box {
  background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.01));
  border: 1px solid rgba(255,255,255,.14);
  border-radius: 14px;
  padding: 16px 18px;
  font-size: 13px;
}
.cred-box-title {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .6px;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 10px;
  padding-bottom: 8px;
  border-bottom: 1px solid rgba(255,255,255,.10);
}
.cred-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; gap: 10px; }
.cred-label { color: var(--text-dim); min-width: 80px; font-size: 12px; }
.cred-value { font-family: monospace; word-break: break-all; color: var(--text); }
.cred-value-group { display: flex; align-items: center; gap: 8px; }
.pw-toggle {
  background: none; border: 1px solid var(--border); color: var(--text-dim);
  border-radius: 6px; padding: 2px 8px; font-size: 11px; cursor: pointer;
}
.pw-toggle:hover { border-color: var(--accent); color: var(--text); }
.copy-btn {
  background: rgba(255,255,255,.06);
  border: 1px solid var(--border);
  color: var(--text-dim);
  border-radius: 6px;
  width: 26px; height: 26px;
  display: inline-flex; align-items: center; justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  transition: all .15s;
}
.copy-btn:hover { border-color: var(--accent); color: var(--text); }
.copy-btn.copied { border-color: var(--success); color: var(--success); }
.pending-box {
  background: rgba(245,158,11,.06);
  border: 1px solid rgba(245,158,11,.25);
  border-radius: 12px;
  padding: 12px 16px;
  font-size: 13px;
  color: var(--text-dim);
}
.order-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
.btn-cancel-order {
  background: rgba(239,68,68,.1);
  border: 1px solid rgba(239,68,68,.35);
  color: #fca5a5;
  padding: 7px 16px;
  font-size: 12.5px;
}
.btn-cancel-order:hover { background: rgba(239,68,68,.18); }
.btn-qris {
  padding: 7px 16px;
  font-size: 12.5px;
}
/* Kotak QRIS yang muncul inline di bawah pesanan pending, per-ID pesanan
   (id="qr-box-{orderId}") supaya QR yang tampil selalu QR pesanan itu
   sendiri, gak ketuker sama pesanan lain. */
.qr-inline {
  margin-top: 14px;
  padding: 18px;
  border-radius: 14px;
  border: 1px solid rgba(245,158,11,.25);
  background: rgba(245,158,11,.05);
  text-align: center;
}
.qr-inline img { width: 200px; height: 200px; border-radius: 10px; background: #fff; padding: 8px; }
.qr-inline .qr-amount { font-weight: 700; font-size: 16px; margin: 10px 0 4px; }
.qr-inline .qr-hint { color: var(--text-dim); font-size: 12px; line-height: 1.6; max-width: 320px; margin: 0 auto; }
@media (max-width: 560px) {
  .cred-row { flex-direction: column; align-items: flex-start; gap: 4px; }
  .cred-label { min-width: auto; }
  .cred-value { font-size: 12px; }
}
.order-tabs {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}
.order-tab {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 16px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text-dim);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all .15s;
}
.order-tab:hover { border-color: var(--accent); color: var(--text); }
.order-tab.active {
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  color: #0a0e17;
  border-color: transparent;
}
.order-tab-count {
  background: rgba(255,255,255,.12);
  color: inherit;
  font-size: 11px;
  padding: 1px 7px;
  border-radius: 999px;
  min-width: 18px;
  text-align: center;
}
.order-tab.active .order-tab-count { background: rgba(0,0,0,.15); }
.completed-box {
  background: rgba(255,255,255,.04);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 16px;
  font-size: 13px;
  color: var(--text-dim);
  margin-top: 6px;
}
.completed-box b { color: var(--text); }
@media (max-width: 480px) {
  .order-tabs { gap: 6px; }
  .order-tab { padding: 8px 12px; font-size: 12px; flex: 1 1 auto; justify-content: center; }
}
</style>
</head>
<body>
<nav>
  <a class="logo" href="/">MarketPanelServer</a>
  <div class="nav-links">
    <a href="/menu.html">Paket</a>
    <div id="nav-user-slot" style="display:flex;gap:16px;align-items:center;"></div>
  </div>
</nav>

<div class="dashboard-wrap">
  <div class="card" style="display:flex;align-items:center;gap:18px;">
    <svg width="48" height="48" viewBox="0 0 46 46" fill="none">
      <defs>
        <linearGradient id="dg" x1="0" y1="0" x2="46" y2="46">
          <stop offset="0" stop-color="#f5f6f8"/>
          <stop offset="1" stop-color="#9aa0ab"/>
        </linearGradient>
      </defs>
      <path d="M13 30c-4.4 0-8-3.4-8-7.6 0-3.9 3-7.1 6.9-7.6C13 10.3 17.1 7 22 7c5.4 0 9.9 3.9 10.7 9 3.6.5 6.3 3.5 6.3 7.1 0 4-3.3 7.3-7.4 7.3H13z" fill="url(#dg)"/>
    </svg>
    <div>
      <div style="font-weight:700;font-size:18px;">MarketPanelServer</div>
      <div style="color:var(--text-dim);font-size:13px;">Platform penyedia server Pterodactyl & Pyrodactyl — pembayaran QRIS, aktivasi otomatis setelah diverifikasi admin.</div>
    </div>
  </div>

  <h2 style="margin:24px 0 4px;">Riwayat Pesanan</h2>
  <p style="color:var(--text-dim);font-size:14px;margin-bottom:18px;">Detail paket, spesifikasi, dan akses panel kamu.</p>

  <div class="order-tabs" id="order-tabs">
    <button class="order-tab active" data-tab="aktif">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6l-8-4Z"/><path d="m9 12 2 2 4-4"/></svg>
      Pesanan Aktif <span class="order-tab-count" id="count-aktif">0</span>
    </button>
    <button class="order-tab" data-tab="pending">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      Pesanan Pending <span class="order-tab-count" id="count-pending">0</span>
    </button>
    <button class="order-tab" data-tab="riwayat">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v5h5"/><path d="M3.05 13a9 9 0 1 0 2.13-8.7L3 8"/><path d="M12 7v5l3 3"/></svg>
      Riwayat <span class="order-tab-count" id="count-riwayat">0</span>
    </button>
  </div>

  <div id="orders-list">
    <p style="color:var(--text-dim)">Memuat...</p>
  </div>
</div>

<footer>© 2026 MarketPanelServer · supplyserverpanel.kenxzo.my.id</footer>

<script src="/js/common.js"></script>
<script>
const statusMap = {
  pending: '<span class="badge status-pending">Pending</span>',
  paid: '<span class="badge status-paid">Aktif</span>',
  expired: '<span class="badge status-expired">Terselesaikan</span>',
  cancelled: '<span class="badge status-cancelled">Dibatalkan</span>',
};

let allOrders = [];
let currentTab = "aktif";

async function guard() {
  const user = await getCurrentUser();
  if (!user) { window.location.href = "/login.html"; return; }
  loadOrders();
}

function specPills(o) {
  if (o.category === "admin_panel") {
    return [`${o.ram_mb} MB RAM (VPS)`, `${o.cpu_percent}% CPU`];
  }
  return [
    o.ram_mb === 0 ? "Unlimited RAM" : `${o.ram_mb} MB RAM`,
    o.disk_mb === 0 ? "Unlimited Disk" : `${o.disk_mb} MB Disk`,
    `${o.cpu_percent}% CPU`,
    `${o.databases} Database`,
    `${o.backups} Backup`,
    o.egg_choice === "whatsapp" ? "Egg: WhatsApp Bot" : o.egg_choice === "minecraft" ? "Egg: Minecraft" : null,
  ].filter(Boolean);
}

function credentialBlock(o, idx) {
  if (o.status !== "paid") return "";

  if (o.category === "admin_panel") {
    return `<div class="pending-box" style="margin-top:6px;">Admin sedang menyiapkan Reseller Panel Server kamu, akan dihubungi lewat kontak yang terdaftar.</div>`;
  }

  if (!o.panel_username || !o.panel_password) return "";

  const escUser = o.panel_username.replace(/'/g, "\\'");
  const escPass = o.panel_password.replace(/'/g, "\\'");

  return `
    <div class="cred-box" style="margin-top:6px;">
      <div class="cred-box-title">Akses Panel Kamu</div>
      <div class="cred-row">
        <span class="cred-label">Panel</span>
        <a class="cred-value" href="${o.panel_url}" target="_blank" style="color:var(--accent2)">${o.panel_url}</a>
      </div>
      <div class="cred-row">
        <span class="cred-label">Username</span>
        <span class="cred-value-group">
          <span class="cred-value">${o.panel_username}</span>
          <button class="copy-btn" onclick="copyCred(this, '${escUser}')" title="Salin username">${COPY_ICON}</button>
        </span>
      </div>
      <div class="cred-row">
        <span class="cred-label">Password</span>
        <span class="cred-value-group">
          <span class="cred-value" id="pw-${idx}">••••••••</span>
          <button class="pw-toggle" onclick="togglePw(${idx}, '${escPass}')">Show</button>
          <button class="copy-btn" onclick="copyCred(this, '${escPass}')" title="Salin password">${COPY_ICON}</button>
        </span>
      </div>
    </div>`;
}

const COPY_ICON = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
const CHECK_ICON_SM = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';

function copyCred(btn, value) {
  navigator.clipboard.writeText(value).then(() => {
    const original = btn.innerHTML;
    btn.innerHTML = CHECK_ICON_SM;
    btn.classList.add("copied");
    setTimeout(() => {
      btn.innerHTML = original;
      btn.classList.remove("copied");
    }, 1500);
  }).catch(() => {
    // Fallback untuk browser lama / non-HTTPS lokal
    const ta = document.createElement("textarea");
    ta.value = value;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
  });
}

function togglePw(idx, real) {
  const el = document.getElementById(`pw-${idx}`);
  const btn = el.nextElementSibling;
  if (el.textContent === "••••••••") {
    el.textContent = real;
    btn.textContent = "Hide";
  } else {
    el.textContent = "••••••••";
    btn.textContent = "Show";
  }
}

// Timer polling status per order-id, biar tiap kotak QRIS yang lagi
// kebuka bisa auto-update begitu pembayaran keverifikasi, tanpa nyampur
// antar pesanan (key-nya persis order.id, bukan index array).
const qrPollTimers = {};

function clearAllQrTimers() {
  Object.values(qrPollTimers).forEach(clearInterval);
  for (const k in qrPollTimers) delete qrPollTimers[k];
}

async function loadQrInto(orderId, box) {
  box.innerHTML = `<p style="color:var(--text-dim);font-size:13px;">Memuat QRIS...</p>`;
  try {
    const data = await apiFetch(`/api/orders/${orderId}/qr`);
    box.innerHTML = `
      <img src="${data.qr_image}" alt="QRIS pesanan ${orderId}" />
      <div class="qr-amount">${formatRupiah(data.amount)}</div>
      <div class="qr-hint">Scan pakai e-wallet / m-banking kamu. Status di atas otomatis berubah begitu pembayaran terverifikasi.</div>
    `;
    if (qrPollTimers[orderId]) clearInterval(qrPollTimers[orderId]);
    qrPollTimers[orderId] = setInterval(() => refreshOrderStatus(orderId), 5000);
  } catch (e) {
    box.innerHTML = `<p style="color:var(--danger);font-size:13px;">Gagal memuat QRIS: ${e.message}. <a href="#" onclick="event.preventDefault(); loadQrInto(${orderId}, document.getElementById('qr-box-${orderId}'))" style="color:var(--accent2)">Coba lagi</a></p>`;
  }
}

async function toggleQr(orderId, btn) {
  const box = document.getElementById(`qr-box-${orderId}`);
  if (!box) return;

  const isOpen = box.style.display !== "none";
  if (isOpen) {
    box.style.display = "none";
    btn.textContent = "Tampilkan QRIS";
    if (qrPollTimers[orderId]) { clearInterval(qrPollTimers[orderId]); delete qrPollTimers[orderId]; }
    return;
  }

  box.style.display = "block";
  btn.textContent = "Sembunyikan QRIS";
  await loadQrInto(orderId, box);
}

async function refreshOrderStatus(orderId) {
  try {
    const { order } = await apiFetch(`/api/orders/${orderId}/status`);
    if (order.status !== "pending") {
      if (qrPollTimers[orderId]) { clearInterval(qrPollTimers[orderId]); delete qrPollTimers[orderId]; }
      loadOrders();
    }
  } catch {}
}

function completedBlock(o) {
  if (o.status !== "expired") return "";
  const durasiText = o.duration === "monthly" ? "1 bulan" : "1 minggu";
  return `<div class="completed-box"><b>Pesanan Terselesaikan.</b> Server sudah aktif selama ${durasiText} sesuai paket yang kamu beli, dan otomatis dinonaktifkan setelah masa aktif habis. Mau lanjut pakai? Order paket baru kapan saja lewat menu Paket.</div>`;
}

async function loadOrders() {
  clearAllQrTimers();
  const list = document.getElementById("orders-list");
  try {
    const { orders } = await apiFetch("/api/orders");
    allOrders = orders;
    updateTabCounts();
    renderOrders();
  } catch (e) {
    list.innerHTML = `<p style="color:var(--danger)">${e.message}</p>`;
  }
}

function updateTabCounts() {
  document.getElementById("count-aktif").textContent = allOrders.filter(o => o.status === "paid").length;
  document.getElementById("count-pending").textContent = allOrders.filter(o => o.status === "pending").length;
  document.getElementById("count-riwayat").textContent = allOrders.filter(o => o.status === "expired" || o.status === "cancelled").length;
}

function renderOrders() {
  const list = document.getElementById("orders-list");
  const filtered = allOrders.filter(o => {
    if (currentTab === "aktif") return o.status === "paid";
    if (currentTab === "pending") return o.status === "pending";
    return o.status === "expired" || o.status === "cancelled";
  });

  if (!allOrders.length) {
    list.innerHTML = '<p style="color:var(--text-dim)">Belum ada pesanan. <a href="/menu.html" style="color:var(--accent)">Pilih paket sekarang</a>.</p>';
    return;
  }
  if (!filtered.length) {
    const emptyText = currentTab === "aktif" ? "Belum ada pesanan aktif."
      : currentTab === "pending" ? "Tidak ada pesanan pending."
      : "Belum ada riwayat pesanan selesai/dibatalkan.";
    list.innerHTML = `<p style="color:var(--text-dim)">${emptyText}</p>`;
    return;
  }

  list.innerHTML = filtered.map((o, idx) => `
    <div class="order-card">
      <div class="order-head">
        <div>
          <div class="order-title">${o.package_name} — ${o.server_name}${o.category === 'private' ? ' <span style="color:var(--gold);font-size:11px;font-weight:700;border:1px solid rgba(var(--gold-glow-rgb),.4);padding:2px 8px;border-radius:999px;vertical-align:middle;">GOLD</span>' : ''}</div>
          <div class="order-sub">${o.invoice_code} · ${o.duration === 'monthly' ? 'Bulanan' : 'Mingguan'} · ${formatRupiah(o.amount)}${o.active_until ? ' · Aktif sampai ' + new Date(o.active_until).toLocaleDateString("id-ID") : ''}</div>
        </div>
        <div>${statusMap[o.status] || o.status}</div>
      </div>
      <div class="spec-pills">
        ${specPills(o).map(s => `<span class="spec-pill">${s}</span>`).join("")}
      </div>
      ${credentialBlock(o, idx)}
      ${completedBlock(o)}
      ${o.status === "pending" ? `
        <div class="order-actions">
          <button class="btn btn-outline btn-qris" id="qris-btn-${o.id}" onclick="toggleQr(${o.id}, this)">Tampilkan QRIS</button>
          <button class="btn btn-cancel-order" onclick="cancelOrder(${o.id}, this)">Batalkan Pesanan</button>
        </div>
        <div class="qr-inline" id="qr-box-${o.id}" style="display:none;"></div>
      ` : ""}
    </div>
  `).join("");
}

document.getElementById("order-tabs").addEventListener("click", (e) => {
  const btn = e.target.closest(".order-tab");
  if (!btn) return;
  document.querySelectorAll(".order-tab").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  currentTab = btn.dataset.tab;
  clearAllQrTimers();
  renderOrders();
});

async function cancelOrder(id, btn) {
  if (!confirm("Yakin ingin membatalkan pesanan ini?")) return;
  btn.disabled = true;
  btn.textContent = "Membatalkan...";
  try {
    await apiFetch(`/api/orders/${id}/cancel`, { method: "POST" });
    loadOrders();
  } catch (e) {
    alert("Gagal membatalkan: " + e.message);
    btn.disabled = false;
    btn.textContent = "Batalkan Pesanan";
  }
}

guard();
</script>
</body>
</html>
